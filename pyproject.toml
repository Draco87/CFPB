[project]
name = "cfpb"
version = "0.1.0"
description = "Complaint Intelligence Platform on CFPB consumer complaints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = ["ipykernel"]   # run notebooks in VS Code; installed by `uv sync` automatically

# Later modules - add each when you reach it, e.g.  uv add --group m1-bert torch transformers ...
#   m1-bert : torch transformers datasets accelerate evaluate
#   m2      : peft bitsandbytes
#   m3      : xgboost shap
#   m4      : faiss-cpu sentence-transformers
#   m5      : ragas
#   m7      : fastapi uvicorn mlflow evidently pymongo

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
